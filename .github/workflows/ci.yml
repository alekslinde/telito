name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo-doctor
      - run: npm run typecheck
      # The real gate: resolves every asset and compiles every module.
      - run: npx expo export --platform android --output-dir /tmp/telito-export
      - uses: fsfe/reuse-action@v5
